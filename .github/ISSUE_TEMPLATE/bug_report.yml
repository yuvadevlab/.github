name: "🐛 Bug Report"
description: "Report an issue, defect, or broken integration in the Yuva DevLab ecosystem"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in the Yuva DevLab ecosystem.
  - type: dropdown
    id: affected-app
    attributes:
      label: Affected Application / Package
      description: Which repository or package is experiencing this problem?
      options:
        - "devlab-portal (Web / API)"
        - "devlab-shared (@yuva-devlab/* packages)"
        - "finai"
        - "orchestrai"
        - "devlab-logs"
        - "vitalai"
        - "devlab-guard"
        - "incidentai"
        - "devlab-ops (CLI / Operations)"
        - "Ecosystem / Cross-Cutting"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
      placeholder: "When starting the application, the health probe fails because..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Navigate to '...'
        2. Run command '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Error Output
      description: Paste any relevant terminal logs, stack traces, or screenshots.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-Submission Checklist
      options:
        - label: "I have verified this issue exists on the latest dev/main branch"
          required: true
        - label: "I have checked for existing duplicate issues"
          required: true
