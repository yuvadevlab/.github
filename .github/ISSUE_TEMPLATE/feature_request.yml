name: "✨ Feature Request"
description: "Suggest a new capability, enhancement, or integration for the Yuva DevLab ecosystem"
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a new feature, shared package, or ecosystem improvement.
  - type: dropdown
    id: target-layer
    attributes:
      label: Target Architecture Layer
      description: Where does this feature belong?
      options:
        - "devlab-portal (Central Control Plane / Web Console)"
        - "devlab-shared (Design System / SDK / Core Packages)"
        - "finai"
        - "orchestrai"
        - "devlab-logs"
        - "vitalai"
        - "devlab-guard"
        - "incidentai"
        - "devlab-ops (Operational CLI & Runner)"
        - "Cross-Cutting Ecosystem Feature"
    validations:
      required: true
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or developer friction?
      placeholder: "Managing multiple terminals and background processes is difficult because..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Detailed description of what you want to happen and how it should behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: Any alternative solutions or features you considered.
