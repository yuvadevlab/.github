name: "Validate Templates & Workflows"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-yaml:
    name: "Validate Workflows & Templates"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate GitHub Actions & Workflows
        uses: mpalmer/action-validator@v3
        with:
          paths: |
            .github/workflows/*.yml
            .github/actions/**/*.yml

      - name: Validate All YAML Files
        shell: bash
        run: |
          python3 -c "
          import yaml, glob, sys
          files = glob.glob('.github/**/*.yml', recursive=True) + glob.glob('.github/**/*.yaml', recursive=True)
          errors = 0
          for f in sorted(files):
              try:
                  with open(f, 'r') as fp:
                      yaml.safe_load(fp)
                  print(f'✓ Valid YAML: {f}')
              except Exception as e:
                  print(f'✗ Invalid YAML in {f}: {e}', file=sys.stderr)
                  errors += 1
          if errors > 0:
              print(f'\nTotal YAML syntax errors: {errors}', file=sys.stderr)
              sys.exit(1)
          print(f'\nAll {len(files)} YAML files successfully validated.')
          "
