name: Lint PR & Branch

on:
  workflow_call:
    inputs:
      branch-pattern:
        description: 'Regex pattern for allowed branch names'
        required: false
        type: string
        default: '^(feat|fix|refactor|perf|chore|docs|test|ci|hotfix)\/[a-z0-9-]+$'
      require-conventional-commits:
        description: 'Whether to validate PR commits against Conventional Commits'
        required: false
        type: boolean
        default: true

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    name: Validate Branch & Commits
    steps:
      - name: Validate Branch Name
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PATTERN: ${{ inputs.branch-pattern }}
        run: |
          echo "Checking branch name: '$BRANCH_NAME'"
          if [[ ! "$BRANCH_NAME" =~ $PATTERN ]]; then
            echo "::error title=Invalid Branch Name::Branch '$BRANCH_NAME' does not match pattern: $PATTERN"
            echo "Expected: <type>/<description> (e.g. feat/supervisor-engine, fix/port-collision)"
            echo "Allowed types: feat, fix, refactor, perf, chore, docs, test, ci, hotfix"
            exit 1
          fi
          echo "✓ Branch name is valid."

      - name: Checkout Code
        if: inputs.require-conventional-commits && github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PR Title & Commits
        if: inputs.require-conventional-commits && github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          COMMIT_PATTERN='^(feat|fix|refactor|perf|chore|docs|test|ci|hotfix|revert)(\([a-z0-9_-]+\))?!?: .+$'

          echo "Checking PR Title: '$PR_TITLE'"
          if [[ ! "$PR_TITLE" =~ $COMMIT_PATTERN ]]; then
            echo "::error title=Invalid PR Title::PR title '$PR_TITLE' does not follow Conventional Commits."
            echo "Expected: <type>(<scope>): <summary> (e.g. feat(supervisor): add port prober)"
            exit 1
          fi
          echo "✓ PR Title is valid."

          echo "Checking commit messages in PR..."
          FAILED=0
          COMMITS=$(git log --no-merges --format="%s" "origin/$BASE_REF..HEAD")

          while IFS= read -r line; do
            if [ -z "$line" ]; then
              continue
            fi
            echo "Inspecting commit: $line"
            if [[ ! "$line" =~ $COMMIT_PATTERN ]]; then
              echo "::error title=Invalid Commit Message::Commit '$line' does not follow Conventional Commits."
              FAILED=1
            fi
          done <<< "$COMMITS"

          if [ $FAILED -ne 0 ]; then
            echo "One or more commits failed validation."
            exit 1
          fi
          echo "✓ All commits follow Conventional Commits."
